GitHub Desktopに戻る

左側の Changes に release-windows.yml が表示されれば、Commit to main が押せます。

表示されない場合は、GitHub Desktopの画面全体をもう一度送ってください。 "Commit to main" が無効な場合は、押そうとせずそのままで大丈夫です。


